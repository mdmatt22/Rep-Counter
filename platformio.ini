; Rep Counter — Elecrow CrowPanel 2.13" ESP32-S3 e-paper (SSD1680, 250x122)
;
;   pio run -e sim -t upload     fake reps generated in software (default)
;   pio run -e reed -t upload    real reed switch on the GPIO header (IO40)

[platformio]
default_envs = sim

[env]
platform = espressif32@^6.9.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
lib_deps =
    zinggjm/GxEPD2@^1.5.8
    adafruit/Adafruit GFX Library@^1.11.9
    olikraus/U8g2_for_Adafruit_GFX@^1.8.0

[env:sim]
build_flags = -DUSE_SIMULATED_REPS=1

[env:reed]
build_flags = -DUSE_SIMULATED_REPS=0
